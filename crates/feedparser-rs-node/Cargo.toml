[package]
name = "feedparser-rs-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false  # Published via npm, not crates.io
description = "Node.js bindings for feedparser-rs-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { workspace = true, features = ["std"] }
feedparser-rs = { path = "../feedparser-rs-core" }
napi = { workspace = true, features = ["napi9", "error_anyhow", "serde-json"] }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["http"]
http = ["feedparser-rs/http"]

[build-dependencies]
napi-build = "2.4"

[dev-dependencies]
quick-xml = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
