# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# List of advisory IDs to ignore
ignore = [
    # RUSTSEC-2026-0097: rand 0.8.5 unsoundness via aliased mutable reference in ThreadRng.
    # This rand version is a transitive build-time-only dependency:
    #   ammonia → html5ever → markup5ever → web_atoms (build) → phf_codegen/string_cache_codegen → phf_generator → rand
    # The unsoundness requires a custom logger calling rand::rng() during ThreadRng reseed,
    # which cannot occur in a build script context. Upgrade is blocked until ammonia migrates
    # from phf 0.11.x to phf 0.13.x.
    { id = "RUSTSEC-2026-0097", reason = "build-time-only transitive dep via phf_generator; unsoundness conditions unreachable in build scripts" },
]

[licenses]
version = 2
# List of allowed licenses (SPDX identifiers)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "0BSD",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",  # Used by ammonia's dependencies (cssparser, etc.)
    "CDLA-Permissive-2.0",  # Used by webpki-roots (root certificate data)
    "OpenSSL",  # Used by aws-lc-sys (rustls crypto backend)
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# Clarifications for licenses that are complex
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Warn about multiple versions of the same crate
multiple-versions = "warn"
# Allow wildcard dependencies
wildcards = "allow"
# Highlight all duplicate versions
highlight = "all"
# Allow private workspace crates
workspace-default-features = "allow"
external-default-features = "allow"
# Skip certain crates from multiple version checks
skip = []
# Skip certain crates from being checked at all
skip-tree = []

[sources]
# Warn about crates from unknown registries
unknown-registry = "warn"
# Warn about crates from unknown git repositories
unknown-git = "warn"
# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow git sources (needed for some dependencies)
allow-git = []
